<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Consolas, 'Courier New', monospace">
  <rect x="0" y="0" width="1200" height="600" fill="#FAF6EF"/>
  <rect x="24" y="24" width="1152" height="552" fill="none" stroke="#B23A2E" stroke-width="3"/>
  <text x="600" y="66" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F1B16">SELFHOSTED-ZH :: 新手起步 5 步</text>
  <text x="600" y="96" text-anchor="middle" font-size="16" fill="#B23A2E">域名 → 服务器 → 反代HTTPS → 装服务 → 备份</text>
  <g>
    <rect x="40" y="150" width="190" height="300" fill="#FFFFFF" stroke="#B23A2E" stroke-width="2"/>
    <text x="135" y="190" text-anchor="middle" font-size="20" font-weight="bold" fill="#B23A2E">STEP 1</text>
    <text x="135" y="230" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F1B16">域名 DNS</text>
    <text x="135" y="270" text-anchor="middle" font-size="14" fill="#1F1B16">买域名</text>
    <text x="135" y="294" text-anchor="middle" font-size="14" fill="#1F1B16">解析到服务器</text>
    <text x="135" y="318" text-anchor="middle" font-size="14" fill="#1F1B16">Cloudflare 套CDN</text>
    <text x="135" y="360" text-anchor="middle" font-size="14" fill="#B23A2E">例: example.com</text>
  </g>
  <text x="252" y="305" text-anchor="middle" font-size="30" fill="#B23A2E">→</text>
  <g>
    <rect x="270" y="150" width="190" height="300" fill="#FFFFFF" stroke="#B23A2E" stroke-width="2"/>
    <text x="365" y="190" text-anchor="middle" font-size="20" font-weight="bold" fill="#B23A2E">STEP 2</text>
    <text x="365" y="230" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F1B16">服务器</text>
    <text x="365" y="270" text-anchor="middle" font-size="14" fill="#1F1B16">旧电脑 / NAS</text>
    <text x="365" y="294" text-anchor="middle" font-size="14" fill="#1F1B16">或云 VPS</text>
    <text x="365" y="318" text-anchor="middle" font-size="14" fill="#1F1B16">装好 Docker</text>
    <text x="365" y="360" text-anchor="middle" font-size="14" fill="#B23A2E">先练手再买硬件</text>
  </g>
  <text x="482" y="305" text-anchor="middle" font-size="30" fill="#B23A2E">→</text>
  <g>
    <rect x="500" y="150" width="190" height="300" fill="#FFFFFF" stroke="#B23A2E" stroke-width="2"/>
    <text x="595" y="190" text-anchor="middle" font-size="20" font-weight="bold" fill="#B23A2E">STEP 3</text>
    <text x="595" y="230" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F1B16">反代+HTTPS</text>
    <text x="595" y="270" text-anchor="middle" font-size="14" fill="#1F1B16">Nginx Proxy Mgr</text>
    <text x="595" y="294" text-anchor="middle" font-size="14" fill="#1F1B16">/ Caddy / Traefik</text>
    <text x="595" y="318" text-anchor="middle" font-size="14" fill="#1F1B16">自动签证书</text>
    <text x="595" y="360" text-anchor="middle" font-size="14" fill="#B23A2E">公网必上 HTTPS</text>
  </g>
  <text x="712" y="305" text-anchor="middle" font-size="30" fill="#B23A2E">→</text>
  <g>
    <rect x="730" y="150" width="190" height="300" fill="#FFFFFF" stroke="#B23A2E" stroke-width="2"/>
    <text x="825" y="190" text-anchor="middle" font-size="20" font-weight="bold" fill="#B23A2E">STEP 4</text>
    <text x="825" y="230" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F1B16">装业务服务</text>
    <text x="825" y="270" text-anchor="middle" font-size="14" fill="#1F1B16">Nextcloud</text>
    <text x="825" y="294" text-anchor="middle" font-size="14" fill="#1F1B16">Immich / Jellyfin</text>
    <text x="825" y="318" text-anchor="middle" font-size="14" fill="#1F1B16">Vaultwarden</text>
    <text x="825" y="360" text-anchor="middle" font-size="14" fill="#B23A2E">一条 compose 起来</text>
  </g>
  <text x="942" y="305" text-anchor="middle" font-size="30" fill="#B23A2E">→</text>
  <g>
    <rect x="960" y="150" width="190" height="300" fill="#B23A2E" stroke="#1F1B16" stroke-width="2"/>
    <text x="1055" y="190" text-anchor="middle" font-size="20" font-weight="bold" fill="#FAF6EF">STEP 5</text>
    <text x="1055" y="230" text-anchor="middle" font-size="20" font-weight="bold" fill="#FAF6EF">备份!</text>
    <text x="1055" y="270" text-anchor="middle" font-size="14" fill="#FAF6EF">Restic / Borg</text>
    <text x="1055" y="294" text-anchor="middle" font-size="14" fill="#FAF6EF">3-2-1 副本</text>
    <text x="1055" y="318" text-anchor="middle" font-size="14" fill="#FAF6EF">定期恢复演练</text>
    <text x="1055" y="360" text-anchor="middle" font-size="14" fill="#FAF6EF">没备份=白搭</text>
  </g>
  <text x="600" y="510" text-anchor="middle" font-size="16" fill="#1F1B16">安全基线: 关多余端口 · 强制HTTPS · 2FA · 定期更新 · 别裸奔后台</text>
  <text x="600" y="540" text-anchor="middle" font-size="15" fill="#B23A2E">详见 selfhosted/01-getting-started.md</text>
</svg>